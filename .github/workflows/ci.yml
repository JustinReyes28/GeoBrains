name: Quality checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/geobrains
      AUTH_SECRET: ci-only-not-a-deployed-secret
      NEXTAUTH_SECRET: ci-only-not-a-deployed-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
